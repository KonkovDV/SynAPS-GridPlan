[package]
name = "synaps_gridplan_rs"
version = "0.1.3"
edition = "2021"
rust-version = "1.75"
description = "Native GridPlan contour: FIFO baseline, fail-closed checks, fingerprints (experimental)"
license = "MIT"
readme = "README.md"
keywords = ["power-grid", "maintenance", "scheduling", "toir", "outage"]
categories = ["science", "command-line-utilities"]
repository = "https://github.com/KonkovDV/SynAPS-GridPlan"

[lib]
name = "synaps_gridplan_rs"
path = "src/lib.rs"

[[bin]]
name = "synaps-gridplan-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["serde", "v5"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
