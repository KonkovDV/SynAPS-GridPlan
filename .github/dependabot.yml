# Dependabot: keep GitHub Actions and Cargo pins current.
# Python runtime deps are pinned by `requirements-lock.txt` (uv compile, CI-verified).
# sha2 0.11 changes digest wiring vs the Python checker; freeze majors until
# fingerprint parity is re-validated (after 20.08.2026 filing).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: "/native/synaps-gridplan-rs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
