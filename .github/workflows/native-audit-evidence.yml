name: Native audit evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  native-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/gridplan-native-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Native probes
        id: probes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          cd native/synaps-gridplan-rs
          set +e
          cargo fmt --check > "$RUNNER_TEMP/native-evidence/format.txt" 2>&1
          fmt=$?
          cargo test --locked > "$RUNNER_TEMP/native-evidence/tests.txt" 2>&1
          tests=$?
          cargo clippy --locked -- -D warnings > "$RUNNER_TEMP/native-evidence/clippy.txt" 2>&1
          clippy=$?
          printf 'format=%s tests=%s clippy=%s\n' "$fmt" "$tests" "$clippy" > "$RUNNER_TEMP/native-evidence/status.txt"
          exit $((fmt | tests | clippy))
      - name: Publish bounded diagnostics
        if: always() && steps.probes.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUDIT_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'native-evidence'
          parts = [f"## Native audit execution `{os.environ['AUDIT_HEAD']}`\n"]
          for name in ('status', 'format', 'tests', 'clippy'):
              path = folder / f'{name}.txt'
              text = path.read_text(errors='replace') if path.exists() else 'not produced'
              text = text[-14000:].replace('```', "''' ")
              parts.append(f'### {name}\n```text\n{text}\n```\n')
          folder.mkdir(exist_ok=True)
          (folder / 'comment.md').write_text('\n'.join(parts))
          PY
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/native-evidence/comment.md"
