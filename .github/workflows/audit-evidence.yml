name: audit evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/gridplan-fail-closed-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Collect bounded diagnostics
        id: probes
        run: |
          set +e
          python -m ruff check src tests > /tmp/audit-lint.txt 2>&1
          lint=$?
          python -m ruff format --diff src tests > /tmp/audit-format.txt 2>&1
          format=$?
          python -m pytest -q --tb=short > /tmp/audit-tests.txt 2>&1
          tests=$?
          printf 'lint=%s format=%s tests=%s\n' "$lint" "$format" "$tests" > /tmp/audit-status.txt
          exit $((lint | format | tests))
      - name: Publish evidence to this audit PR only
        if: always() && steps.probes.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          parts = [f"## Audit execution `{os.environ['HEAD_SHA']}`"]
          for name in ('status', 'lint', 'format', 'tests'):
              path = Path(f'/tmp/audit-{name}.txt')
              text = path.read_text() if path.exists() else 'No output: step did not execute.'
              text = text[-14000:].replace('```', '` ` `')
              parts.append(f'### {name}\n```text\n{text}\n```')
          Path('/tmp/audit-comment.md').write_text('\n\n'.join(parts))
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/audit-comment.md
